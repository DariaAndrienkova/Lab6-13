<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер екскурсій та подорожей</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .status { min-height: 1.4em; margin: 12px 0 0; font-weight: 600; }
        .status.ok { color: #27ae60; }
        .status.error { color: #c0392b; }
    </style>
</head>
<body>

    <h1>🏛️ Трекер екскурсій та подорожей</h1>
    <p class="subtitle">Облік відвіданих місць, музеїв та екскурсій</p>

    <div class="card">
        <form id="excursion-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Дата:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="name">Назва (музей / місце):</label>
                    <input type="text" id="name" placeholder="Наприклад: Пирогово" required>
                </div>
                <div class="form-group">
                    <label for="category">Категорія:</label>
                    <input type="text" id="category" placeholder="Наприклад: музей, природа" required>
                </div>
                <div class="form-group">
                    <label for="cost">Вартість (грн):</label>
                    <input type="number" id="cost" step="0.01" placeholder="200" required>
                </div>
                <div class="form-group">
                    <label for="duration">Тривалість (год):</label>
                    <input type="number" id="duration" step="0.1" placeholder="4.0" required>
                </div>
                <div class="form-group full-width">
                    <label for="comment">Коментар:</label>
                  <textarea id="comment" placeholder="Чудова прогулянка на свіжому повітрі..."></textarea>
                </div>
            </div>
            <button type="submit">Додати екскурсію</button>
            <p id="status" class="status"></p>
        </form>
    </div>

    <div class="card">
        <h2>Список відвіданих місць</h2>
        <table id="excursions-table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Назва</th>
                    <th>Категорія</th>
                    <th>Вартість</th>
                    <th>Тривалість</th>
                    <th>Коментар</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Сюди динамічно завантажуватимуться дані -->
            </tbody>
        </table>
    </div>


    <script>
        // Адреса API: на справжньому сайті це твій піддомен, локально (localhost) це Flask на 8000
        const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
            ? "http://127.0.0.1:8000"
            : "https://api.andrienkova.pp.ua";

        const form = document.getElementById("excursion-form");
        const tbody = document.getElementById("table-body");
        const statusEl = document.getElementById("status");

        function showStatus(text, ok) {
            statusEl.textContent = text;
            statusEl.className = "status " + (ok ? "ok" : "error");
        }

        function addCell(row, text) {
            const td = document.createElement("td");
            td.textContent = text;          // textContent, не innerHTML: захист від XSS
            row.appendChild(td);
        }

        async function loadItems() {
            try {
                const response = await fetch(API + "/items");
                if (!response.ok) {
                    throw new Error("сервер відповів " + response.status);
                }
                const items = await response.json();
                tbody.innerHTML = "";
                for (const item of items) {
                    const tr = document.createElement("tr");
                    addCell(tr, item.date);
                    addCell(tr, item.title);
                    addCell(tr, item.category);
                    addCell(tr, item.amount + " грн");
                    addCell(tr, item.duration + " год");
                    addCell(tr, item.note || "");
                    tbody.appendChild(tr);
                }
            } catch (err) {
                showStatus("Не вдалося завантажити список: " + err.message, false);
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();         // не перезавантажувати сторінку
            const body = {
                date: document.getElementById("date").value,
                title: document.getElementById("name").value,
                category: document.getElementById("category").value,
                amount: document.getElementById("cost").value,
                duration: document.getElementById("duration").value,
                note: document.getElementById("comment").value,
            };
            try {
                const response = await fetch(API + "/items", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                });
                const result = await response.json();
                if (!response.ok) {
                    showStatus("Помилка: " + result.error, false);
                    return;
                }
                showStatus("Екскурсію додано", true);
                form.reset();
                loadItems();
            } catch (err) {
                showStatus("Немає зв'язку з сервером: " + err.message, false);
            }
        });

        loadItems();
    </script>

</body>
</html>
