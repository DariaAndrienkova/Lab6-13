<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Трекер екскурсій та подорожей</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        form {
            display: grid;
            gap: 10px;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        input, button {
            padding: 10px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
            background: #477b65;
            color: white;
            border: none;
            border-radius: 5px;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #477b65;
            color: white;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<h1>Трекер екскурсій та подорожей</h1>

<form id="form">

    <input id="date" type="date" required>

    <input id="title" type="text"
           placeholder="Назва місця" required>

    <input id="category" type="text"
           placeholder="Категорія" required>

    <input id="cost" type="number"
           placeholder="Вартість" min="0" step="0.01" required>

    <input id="duration" type="number"
           placeholder="Тривалість у годинах"
           min="0" step="0.1" required>

    <input id="comment" type="text"
           placeholder="Коментар">

    <button type="submit">Додати екскурсію</button>

</form>

<p id="status"></p>

<table>

    <thead>
        <tr>
            <th>Дата</th>
            <th>Місце</th>
            <th>Категорія</th>
            <th>Вартість</th>
            <th>Тривалість</th>
            <th>Коментар</th>
        </tr>
    </thead>

    <tbody id="list"></tbody>

</table>

<script>

const API = "https://api.andrienkova.pp.ua";


async function load() {

    const status = document.getElementById("status");

    try {

        const response = await fetch(API + "/items");

        if (!response.ok) {
            throw new Error("Не вдалося отримати записи");
        }

        const items = await response.json();

        const list = document.getElementById("list");

        list.replaceChildren();

        for (const item of items) {

            const row = document.createElement("tr");

            const values = [
                item.date,
                item.title,
                item.category,
                item.cost + " грн",
                item.duration + " год.",
                item.comment || ""
            ];

            for (const value of values) {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            }

            list.appendChild(row);
        }

    } catch (error) {

        status.textContent = "Помилка завантаження: " + error.message;

    }
}


document.getElementById("form").addEventListener("submit", async function(event) {

    event.preventDefault();

    const body = {
        date: document.getElementById("date").value,
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        cost: document.getElementById("cost").value,
        duration: document.getElementById("duration").value,
        comment: document.getElementById("comment").value
    };

    const status = document.getElementById("status");

    try {

        const response = await fetch(API + "/items", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(body)

        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Помилка додавання");
        }

        status.textContent = "Екскурсію успішно додано!";

        document.getElementById("form").reset();

        await load();

    } catch (error) {

        status.textContent = "Помилка: " + error.message;

    }

});


load();

</script>

</body>
</html>
