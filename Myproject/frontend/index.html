<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер екскурсій та подорожей</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .status { min-height: 1.4em; margin: 12px 0 0; font-weight: 600; }
        .status.ok { color: #27ae60; }
        .status.error { color: #c0392b; }
        .hidden { display: none; }
        .table-wrap { overflow-x: auto; }   /* на телефоні таблиця гортається вбік */
        .topbar { display: flex; justify-content: space-between; align-items: center;
                  margin-bottom: 20px; gap: 10px; }
        .topbar button { width: auto; padding: 8px 16px; font-size: 14px; background: #7f8c8d; }
        .topbar button:hover { background: #636e72; }
        .auth-buttons { display: flex; gap: 10px; }
        .auth-buttons button.secondary { background: #2c3e50; }
        td button.delete { width: auto; padding: 6px 12px; font-size: 13px; background: #c0392b; }
        td button.delete:hover { background: #a93226; }
    </style>
</head>
<body>

    <h1>🏛️ Трекер екскурсій та подорожей</h1>
    <p class="subtitle">Облік відвіданих місць, музеїв та екскурсій</p>

    <!-- Вхід і реєстрація: видно, поки користувач не увійшов -->
    <div class="card" id="auth-card">
        <h2>Вхід</h2>
        <form id="auth-form">
            <div class="form-group">
                <label for="login">Логін:</label>
                <input type="text" id="login" autocomplete="username" minlength="3" maxlength="50" required>
            </div>
            <div class="form-group">
                <label for="password">Пароль (від 8 символів):</label>
                <input type="password" id="password" autocomplete="current-password" minlength="8" required>
            </div>
            <div class="auth-buttons">
                <button type="submit" id="login-btn">Увійти</button>
                <button type="button" id="register-btn" class="secondary">Зареєструватися</button>
            </div>
            <p id="auth-status" class="status"></p>
        </form>
    </div>

    <!-- Застосунок: видно лише після входу -->
    <div id="app" class="hidden">
    <div class="topbar">
        <span>Ви увійшли як <b id="who"></b></span>
        <button type="button" id="logout-btn">Вийти</button>
    </div>

    <div class="card">
        <form id="excursion-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Дата:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="name">Назва (музей / місце):</label>
                    <input type="text" id="name" placeholder="Наприклад: Пирогово" required>
                </div>
                <div class="form-group">
                    <label for="category">Категорія:</label>
                    <input type="text" id="category" placeholder="Наприклад: музей, природа" required>
                </div>
                <div class="form-group">
                    <label for="cost">Вартість (грн):</label>
                    <input type="number" id="cost" step="0.01" placeholder="200" required>
                </div>
                <div class="form-group">
                    <label for="duration">Тривалість (год):</label>
                    <input type="number" id="duration" step="0.1" placeholder="4.0" required>
                </div>
                <div class="form-group full-width">
                    <label for="comment">Коментар:</label>
                  <textarea id="comment" placeholder="Чудова прогулянка на свіжому повітрі..."></textarea>
                </div>
            </div>
            <button type="submit">Додати екскурсію</button>
            <p id="status" class="status"></p>
        </form>
    </div>

    <div class="card">
        <h2>Список відвіданих місць</h2>
        <div class="table-wrap">
        <table id="excursions-table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Назва</th>
                    <th>Категорія</th>
                    <th>Вартість</th>
                    <th>Тривалість</th>
                    <th>Коментар</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Сюди динамічно завантажуватимуться дані -->
            </tbody>
        </table>
        </div>
    </div>
    </div>


    <script>
        // Адреса API: на справжньому сайті це твій піддомен, локально (localhost) це Flask на 8000.
        // Локально пишемо саме localhost, а не 127.0.0.1: тоді сторінка й API для браузера
        // це один "сайт" і cookie входу ходить туди-сюди.
        const API = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
            ? "http://localhost:8000"
            : "https://api.andrienkova.pp.ua";

        const authCard = document.getElementById("auth-card");
        const appBox = document.getElementById("app");
        const authForm = document.getElementById("auth-form");
        const form = document.getElementById("excursion-form");
        const tbody = document.getElementById("table-body");
        const statusEl = document.getElementById("status");
        const authStatus = document.getElementById("auth-status");

        // Усі запити йдуть через цю функцію. credentials: "include" змушує браузер
        // надсилати cookie входу на API. Без цього сервер бачить анонімний запит і дає 401.
        function api(path, options = {}) {
            const headers = {};
            if (options.body) headers["Content-Type"] = "application/json";
            return fetch(API + path, { credentials: "include", headers, ...options });
        }

        function show(el, text, ok) {
            el.textContent = text;
            el.className = "status " + (ok ? "ok" : "error");
        }

        function addCell(row, text) {
            const td = document.createElement("td");
            td.textContent = text;          // textContent, не innerHTML: захист від XSS
            row.appendChild(td);
        }

        function showApp(user) {
            document.getElementById("who").textContent = user.login;
            authCard.classList.add("hidden");
            appBox.classList.remove("hidden");
            loadItems();
        }

        function showLogin() {
            appBox.classList.add("hidden");
            authCard.classList.remove("hidden");
            tbody.innerHTML = "";
        }

        async function loadItems() {
            try {
                const response = await api("/items");
                if (response.status === 401) {      // сесія закінчилась
                    showLogin();
                    return;
                }
                if (!response.ok) {
                    throw new Error("сервер відповів " + response.status);
                }
                const items = await response.json();
                tbody.innerHTML = "";
                for (const item of items) {
                    const tr = document.createElement("tr");
                    addCell(tr, item.date);
                    addCell(tr, item.title);
                    addCell(tr, item.category);
                    addCell(tr, item.amount + " грн");
                    addCell(tr, item.duration + " год");
                    addCell(tr, item.note || "");
                    const td = document.createElement("td");
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "delete";
                    btn.textContent = "Видалити";
                    btn.addEventListener("click", () => deleteItem(item.id));
                    td.appendChild(btn);
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                }
            } catch (err) {
                show(statusEl, "Не вдалося завантажити список: " + err.message, false);
            }
        }

        async function deleteItem(id) {
            if (!confirm("Видалити цей запис?")) return;
            try {
                const response = await api("/items/" + id, { method: "DELETE" });
                if (!response.ok) {
                    show(statusEl, "Не вдалося видалити (код " + response.status + ")", false);
                    return;
                }
                show(statusEl, "Запис видалено", true);
                loadItems();
            } catch (err) {
                show(statusEl, "Немає зв'язку з сервером: " + err.message, false);
            }
        }

        // Вхід і реєстрація використовують одні й ті самі поля
        async function sendAuth(path) {
            const body = JSON.stringify({
                login: document.getElementById("login").value,
                password: document.getElementById("password").value,
            });
            try {
                const response = await api(path, { method: "POST", body });
                const result = await response.json();
                if (!response.ok) {
                    show(authStatus, "Помилка: " + result.error, false);
                    return;
                }
                authForm.reset();
                authStatus.textContent = "";
                showApp(result);
            } catch (err) {
                show(authStatus, "Немає зв'язку з сервером: " + err.message, false);
            }
        }

        authForm.addEventListener("submit", (event) => {
            event.preventDefault();
            sendAuth("/login");
        });
        document.getElementById("register-btn").addEventListener("click", () => {
            if (authForm.reportValidity()) sendAuth("/register");   // перевіряє довжину полів
        });

        document.getElementById("logout-btn").addEventListener("click", async () => {
            try { await api("/logout", { method: "POST" }); } catch (err) { /* все одно виходимо */ }
            statusEl.textContent = "";
            showLogin();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();         // не перезавантажувати сторінку
            const body = JSON.stringify({
                date: document.getElementById("date").value,
                title: document.getElementById("name").value,
                category: document.getElementById("category").value,
                amount: document.getElementById("cost").value,
                duration: document.getElementById("duration").value,
                note: document.getElementById("comment").value,
            });
            try {
                const response = await api("/items", { method: "POST", body });
                const result = await response.json();
                if (response.status === 401) {
                    showLogin();
                    return;
                }
                if (!response.ok) {
                    show(statusEl, "Помилка: " + result.error, false);
                    return;
                }
                show(statusEl, "Екскурсію додано", true);
                form.reset();
                loadItems();
            } catch (err) {
                show(statusEl, "Немає зв'язку з сервером: " + err.message, false);
            }
        });

        // При відкритті сторінки питаємо сервер, чи ми вже увійшли (cookie живе 7 днів)
        (async function start() {
            try {
                const response = await api("/me");
                if (response.ok) {
                    showApp(await response.json());
                    return;
                }
            } catch (err) {
                show(authStatus, "Немає зв'язку з сервером", false);
            }
            showLogin();
        })();
    </script>

</body>
</html>
