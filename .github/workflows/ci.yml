name: ci

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Myproject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -v

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - name: Update service
        shell: powershell
        working-directory: C:/lab/myproject-server/Myproject
        run: |
          git pull --ff-only
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker compose up -d --build
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Check health
        shell: powershell
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8000/health
              if ($r.StatusCode -eq 200) { Write-Host "Service is up"; exit 0 }
            } catch { }
            Start-Sleep -Seconds 3
          }
          Write-Host "Service did not respond"
          exit 1
