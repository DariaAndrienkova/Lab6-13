<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Витрати</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    li { display: flex; justify-content: space-between; padding: .3rem 0; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <h1>Витрати</h1>
  <form id="form">
    <input id="date" type="date" required>
    <input id="category" placeholder="категорія" required>
    <input id="amount" type="number" step="0.01" placeholder="сума" required>
    <input id="note" placeholder="коментар">
    <button>Додати</button>
  </form>
  <p id="status"></p>
  <ul id="list"></ul>
  <script>
    const API = "https://api.andrienkova.pp.ua";

    async function load() {
      const response = await fetch(API + "/items");
      const items = await response.json();
      const list = document.getElementById("list");
      list.innerHTML = "";
      for (const item of items) {
        const li = document.createElement("li");
        // Використовуємо textContent для захисту від XSS згідно з методичкою
        li.textContent = ${item.date}  ${item.category}  ${item.amount}  ${item.note || ""};
        list.appendChild(li);
      }
    }

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const body = {
        date: document.getElementById("date").value,
        category: document.getElementById("category").value,
        amount: document.getElementById("amount").value,
        note: document.getElementById("note").value,
      };
      const response = await fetch(API + "/items", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await response.json();
      document.getElementById("status").textContent =
        response.ok ? "додано" : "помилка: " + result.error;
      load();
    });

    load();
  </script>
</body>
</html>
