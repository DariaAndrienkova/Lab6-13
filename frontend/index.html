<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер екскурсій та подорожей</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <h1>🏛️ Трекер екскурсій та подорожей</h1>
    <p class="subtitle">Облік відвіданих місць, музеїв та екскурсій</p>

    <div class="card">
        <form id="excursion-form">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Дата:</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="name">Назва (музей / місце):</label>
                    <input type="text" id="name" placeholder="Наприклад: Пирогово" required>
                </div>
                <div class="form-group">
                    <label for="category">Категорія:</label>
                    <input type="text" id="category" placeholder="Наприклад: музей, природа" required>
                </div>
                <div class="form-group">
                    <label for="cost">Вартість (грн):</label>
                    <input type="number" id="cost" step="0.01" placeholder="200" required>
                </div>
                <div class="form-group">
                    <label for="duration">Тривалість (год):</label>
                    <input type="number" id="duration" step="0.1" placeholder="4.0" required>
                </div>
                <div class="form-group full-width">
                    <label for="comment">Коментар:</label>
                  <textarea id="comment" placeholder="Чудова прогулянка на свіжому повітрі..."></textarea>
                </div>
            </div>
            <button type="submit">Додати екскурсію</button>
        </form>
    </div>

    <div class="card">
        <h2>Список відвіданих місць</h2>
        <table id="excursions-table">
            <thead>
                <tr>
                    <th>Дата</th>
                    <th>Назва</th>
                    <th>Категорія</th>
                    <th>Вартість</th>
                    <th>Тривалість</th>
                    <th>Коментар</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Сюди динамічно завантажуватимуться дані -->
            </tbody>
        </table>
    </div>

</body>
</html>
